services:
  - type: web
    name: safrons-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./safrons.db
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://kelompok-18-safrons.vercel.app","http://localhost:5173","http://127.0.0.1:5173"]'
